<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alan · Interview reader</title>
<style>
:root{color-scheme:light;--bg:#faf9f6;--panel:#f0eee8;--text:#232c2a;--muted:#64716b;--accent:#225f50;--line:#dcded5;--size:24px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100vh;display:grid;grid-template-columns:290px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:16px 12px}h1{font-size:22px;margin:0 8px 5px;letter-spacing:-.6px}.meta{font-size:12px;color:var(--muted);margin:0 8px 12px;line-height:1.4}
input{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;font-size:14px}nav{overflow:auto;flex:1;padding-top:6px}.group{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:10px 10px 4px}
button{cursor:pointer;font:inherit}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.3;margin:1px 0}nav button:hover{background:#e2e6dd}nav button[aria-current=true]{background:var(--accent);color:white}.battle-mark{display:inline-block;font-size:9px;font-weight:750;letter-spacing:.5px;border:1px solid currentColor;border-radius:4px;padding:1px 4px;margin-right:7px;vertical-align:middle;opacity:.8}button:focus-visible,input:focus-visible{outline:3px solid #bd9251;outline-offset:2px}
main{min-width:0;display:flex;flex-direction:column;min-height:0}header{padding:15px 28px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tag{font-size:12px;color:var(--accent);font-weight:650;flex:1}.controls{display:flex;gap:7px;align-items:center}.controls button,.load{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:7px;padding:7px 10px;font-size:13px}.load{display:block;cursor:pointer;text-align:center;margin-top:8px}#import{display:none}
#viewport{overflow:auto;flex:1;padding:40px 7vw 90px}article{max-width:850px;margin:auto}h2{font-size:clamp(24px,3vw,35px);line-height:1.25;margin:0 0 28px;letter-spacing:-.7px}.content{font-size:var(--size);line-height:1.65}.content p{margin:0 0 1.15em}.content ul,.content ol{padding-left:1.3em}.content h3{font-size:1em;margin:1.8em 0 .7em}.content a{color:var(--accent)}.cue{font-size:.67em;color:var(--muted);font-style:italic}.reference .content{font-size:calc(var(--size) - 5px)}table{border-collapse:collapse;width:100%;font-size:.8em}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}footer{font-size:11px;color:var(--muted);margin:8px 8px 0;line-height:1.4}.empty{color:var(--muted);padding:12px}
body.dark{color-scheme:dark;--bg:#17211e;--panel:#1e2b26;--text:#e5eae1;--muted:#a1b0a7;--line:#37493f;--accent:#87cbb6}body.dark nav button[aria-current=true]{background:#315e4e;color:#fff}body.dark nav button:hover{background:#30453a}
@media(max-width:700px){body{grid-template-columns:210px 1fr}aside{padding:16px 10px}#viewport{padding:25px 20px}header{padding:12px}nav button{font-size:12px}.content{font-size:calc(var(--size) - 3px)}}
@media(max-width:450px){body{grid-template-columns:150px 1fr}.meta{font-size:10px}h1{font-size:18px}header{gap:7px}.controls{flex-wrap:wrap}.controls button{padding:5px}#viewport{padding:20px 14px}}
@media print{body{display:block;height:auto}aside,header{display:none}#viewport{overflow:visible;padding:0}.content{font-size:14pt}}
</style>
<aside><h1>Alan</h1><p class="meta">First interview · Celine Brunel<br>9 October · 12:15 Madrid</p><input id="search" type="search" placeholder="Find a question…" aria-label="Find a question"><nav aria-label="Interview sections" id="nav"></nav><label class="load" for="import">Load updated .textream</label><input id="import" type="file" accept=".textream,.json"><footer>Answers and reference notes.<br>← → switch sections · Esc clears search</footer></aside>
<main><header><span class="tag" id="tag"></span><div class="controls"><button id="smaller" aria-label="Decrease text size">A−</button><button id="larger" aria-label="Increase text size">A+</button><button id="theme">Dark</button><button id="copy">Copy text</button></div></header><div id="viewport"><article id="article"><h2 id="title"></h2><div id="body" class="content"></div></article></div></main>
<script id="data" type="application/json">__READER_DATA__</script>
<script>
let items=JSON.parse(document.getElementById('data').textContent),selected=0,size=24;
const $=id=>document.getElementById(id),escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return escape(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>{const decoded=url.replace(/&amp;/g,'&');return /^(https?:|\.\.?\/|[a-zA-Z0-9_-]+\.)/.test(decoded)?`<a href="${url}" target="_blank" rel="noopener">${label}</a>`:label}).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function render(text){let blocks=text.split(/\n\s*\n/);return blocks.map(block=>{let lines=block.trim().split('\n');if(!block.trim())return '';if(lines[0].startsWith('|')){let rows=lines.filter(l=>!/^\|[\s:|-]+\|$/.test(l));return '<table>'+rows.map((l,i)=>'<tr>'+l.split('|').slice(1,-1).map(c=>`<${i?'td':'th'}>${inline(c.trim())}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>'}if(lines.every(l=>/^[-*] /.test(l)))return '<ul>'+lines.map(l=>'<li>'+inline(l.slice(2))+'</li>').join('')+'</ul>';if(lines.every(l=>/^\d+\. /.test(l)))return '<ol>'+lines.map(l=>'<li>'+inline(l.replace(/^\d+\. /,''))+'</li>').join('')+'</ol>';return lines.map(l=>/^#{1,6} /.test(l)?'<h3>'+inline(l.replace(/^#{1,6} /,''))+'</h3>':/^\[.*\]$/.test(l)?'<p class="cue">'+escape(l.slice(1,-1))+'</p>':'<p>'+inline(l)+'</p>').join('')}).join('')}
function filtered(){const q=$('search').value.toLowerCase();return items.map((v,i)=>i).filter(i=>(items[i].title+' '+items[i].text).toLowerCase().includes(q))}
function nav(){const list=filtered();$('nav').replaceChildren();let group='';for(const i of list){if(items[i].group!==group){group=items[i].group;let label=document.createElement('div');label.className='group';label.textContent=group;$('nav').append(label)}let b=document.createElement('button');if(items[i].battle){const badge=document.createElement('span');badge.className='battle-mark';badge.textContent='BC';badge.title='Battle card';b.append(badge);const label=document.createElement('span');label.textContent=items[i].title;b.append(label)}else{b.textContent=items[i].title}b.setAttribute('aria-current',String(selected===i));b.onclick=()=>select(i);$('nav').append(b)}if(!list.length){let e=document.createElement('p');e.className='empty';e.textContent='No matching sections';$('nav').append(e)}}
function select(i){selected=i;const v=items[i];$('title').textContent=v.title;$('tag').textContent=v.battle?'Battle card · project story':v.kind==='answer'?'About me · spoken answer':v.group==='Interview'?'Interview · questions and cues':'Reference · preparation notes';$('article').className=v.group==='Reference'?'reference':'';$('body').innerHTML=render(v.text);$('viewport').scrollTop=0;nav()}
$('search').oninput=nav;$('larger').onclick=()=>{size=Math.min(36,size+2);document.documentElement.style.setProperty('--size',size+'px')};$('smaller').onclick=()=>{size=Math.max(18,size-2);document.documentElement.style.setProperty('--size',size+'px')};$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light':'Dark'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(items[selected].text);$('copy').textContent='Copied'}catch{let r=document.createRange();r.selectNodeContents($('body'));getSelection().removeAllRanges();getSelection().addRange(r);$('copy').textContent='Selected · press ⌘C'}setTimeout(()=>$('copy').textContent='Copy text',2200)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('search').value='';nav();$('search').blur()}if(e.target.matches('input,button')||e.metaKey||e.ctrlKey||e.altKey)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){const list=filtered(),p=list.indexOf(selected),next=list[p+(e.key==='ArrowRight'?1:-1)];if(next!==undefined){e.preventDefault();select(next)}}});
$('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.length||!data.every(x=>typeof x==='string'))throw Error('Expected a nonempty array of page texts');items=[...data.map(p=>({title:p.split('\n')[0].replace(/^\[|\]$/g,''),group:['Tell me about yourself','Why Alan','Working with Product and Engineering','Why did you leave Remuner?'].includes(p.split('\n')[0].replace(/^\[|\]$/g,''))?'About me':'Project battle cards',battle:!['Tell me about yourself','Why Alan','Working with Product and Engineering','Why did you leave Remuner?'].includes(p.split('\n')[0].replace(/^\[|\]$/g,'')),kind:'answer',text:p.split('\n').slice(1).join('\n').trim()})),...items.filter(x=>x.kind!=='answer')];items.sort((a,b)=>['About me','Interview','Project battle cards','Reference'].indexOf(a.group)-['About me','Interview','Project battle cards','Reference'].indexOf(b.group));$('search').value='';select(0)}catch(err){alert('Could not read that Textream file: '+err.message)}finally{e.target.value=''}};
select(0);
</script>
</html>

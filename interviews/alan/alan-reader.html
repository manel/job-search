<script id="data" type="application/json">[{"title": "Tell me about yourself", "group": "About me", "kind": "answer", "battle": false, "text": "I’m a Senior Product Designer based in Barcelona.\n\nI co-founded Kings of Mambo, a UX studio that I ran for eleven years. I worked across research, interaction and visual design, prototyping, and delivery for clients in several industries.\n\nAt Abacum, I worked on data integrations and later financial modeling. One of my main projects was Dataset Manager, where I led design and customer testing to help finance teams configure their data more independently.\n\nMost recently, I was the sole designer at Remuner, a sales-compensation platform. My scope covered data configuration, compensation plans, rep and manager experiences, approvals, and permissions. I also designed its conversational AI agent and built the design system.\n\nThe common thread is making complex products understandable and usable. For my next role, I’m looking to help define the problem, explore options with Product and Engineering, and stay involved through delivery.\n\n[pause — let them ask]"}, {"title": "Why Alan", "group": "About me", "kind": "answer", "battle": false, "text": "What attracts me to Alan is the mission of making healthcare easier to access and navigate. From the role description, Alan Clinic sounds like an interesting design challenge: different people, processes, and rules need to work together, while the experience should remain clear for the member.\n\nThat connects with what I enjoy most in design. At Abacum and Remuner, I worked on making complex logic understandable and usable. Healthcare would be a new domain for me, but the challenge of coordinating different actors and making complicated processes feel simple is familiar.\n\n[pause — let them ask]"}, {"title": "Working with Product and Engineering", "group": "About me", "kind": "answer", "battle": false, "text": "I work closely with Product and Engineering from the beginning of a project. Before I start designing, I involve them to understand the problem, the project requirements, and any technical constraints.\n\nI keep them involved as the design develops, rather than waiting until handoff. I share work in progress so we can check that the direction still makes sense and identify anything that might be difficult to build.\n\nIf a constraint comes up, we can discuss the options while the design is still evolving. That helps me avoid making assumptions and discovering important issues too late.\n\n[pause — let them ask]"}, {"title": "Why did you leave Remuner?", "group": "About me", "kind": "answer", "battle": false, "text": "My role at Remuner ended following a company decision. From my perspective, there was a mismatch in how product decisions were made and how much design could contribute to defining the problem. I’m looking for a role where that discussion happens earlier, with Product and Engineering.\n\n[pause — let them ask]"}, {"title": "Questions for Celine", "group": "Interview", "kind": "notes", "text": "Prioritise role fit and expectations; use the other questions if time permits.\n\n1. “Which product or member journey would this person work on first, and what is the main problem you want them to solve?”\n2. “How would this designer work with Product, Engineering and the other designers, and what would they own independently?”\n3. “What would strong performance look like in the first six months?”\n4. “What are the next stages for the design role, and what will you expect me to prepare?”\n5. “Which levels are you hiring for, and who would be best placed to explain the corresponding Spain base salary and equity package?”\n\nOptional if there is time: “Could you share an example of member research changing the product direction?” This is a question about how the team works, not an assumption that the call includes a design critique.\n\nIf the answer suggests mainly visual production or native-mobile craft, ask how much scope includes research, problem definition and product decisions. If mentoring is prominent, ask who you would support and how it fits IC responsibilities.\n\nCompensation cue: “I saw that your compensation is tied to assessed level. I’d like to understand the levels considered for this role and the corresponding Spain package.” Your approximate EUR 60,000 base floor is internal decision guidance, not the opening number. No applicable level or numeric Alan band is verified here."}, {"title": "How I work — concrete evidence in reserve", "group": "Interview", "kind": "notes", "text": "Use one example in response to the question, rather than listing every practice.\n\n- **Working with Engineering:** “At Remuner, I introduced ad hoc refinement with the CTO and a frontend engineer to discuss feasibility and improvements before handoff.” Specific meeting benefits are not measured.\n- **Creating shared structure:** “I organised design files by role and scope, separating exploration from handoff. Engineers and the wider team used that structure.” Shared use is confirmed; faster delivery is not.\n- **Design judgment:** “I used progressive disclosure in the rep dashboard, reducing the choices visible at once and revealing other information through specific buttons.” Exact iteration, shipment and feedback remain unconfirmed. Keep it separate from the manager-view redesign.\n- **Contributing to the team:** “At Abacum, I introduced agendas and rotating hosts for design meetings, and a design-system meeting that ran when there was progress to review.” Do not infer improved participation or adoption metrics.\n- **AI-assisted practice:** “I also used AI-assisted workflows to build interactive prototypes for user testing.” Those prototypes were separate from production; individual results and the specific tools used are not recorded.\n\nThese are supported ways of working. They are not complete “tell me about a time” stories unless you can supply a particular decision and result."}, {"title": "Likely questions — preparation, not a confirmed script", "group": "Interview", "kind": "notes", "text": "| Question | Cue |\n| --- | --- |\n| Tell me about yourself | Opening above, broad scope then strongest through-line |\n| Why Alan / why healthcare? | Mission, Alan Clinic’s coordination challenge, and making complex processes simple |\n| A project with impact | A or B; observable change, clear evidence limit |\n| Feedback that was vague | G · IC dashboard: clarified different problems, designed all changes, shipped; testing showed users understood missing information |\n| A disagreement | D for leadership; C for capacity pushback |\n| A mistake | E; own assumption, recovery, changed practice |\n| AI experience | F; role/context/boundaries, shared scope, accuracy limitations |\n| Mentoring | General mentoring and teaching confirmed; no complete individual episode yet |\n| How you work with others | Choose one concrete practice above; use A/C for a specific consequential decision |\n| Why did you leave Remuner? | Company-initiated end; desired earlier design involvement |\n\nDeparture draft: “My role at Remuner ended following a company decision. From my perspective, there was a mismatch in how product decisions were made and how much design could contribute to defining the problem. I’m looking for a role where that discussion happens earlier, with Product and Engineering.” This reflects your account, not an employer-confirmed reason. If asked directly whether you resigned, do not imply you did.\n\nMentoring cue: “I’ve mentored designers throughout my career and have also taught UX and implementation-related topics.” If asked for a particular person’s growth, supply a real example; seniority, frequency and development outcomes are not recorded."}, {"title": "Walk me through a project — Dataset Manager", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "A good example is Dataset Manager at Abacum, a financial-planning platform.\n\nFinance teams needed to configure and transform their data before using it in their models. The existing setup relied on technical configuration files, so customers depended on the implementation team. Our goal was to make standard configuration something they could do more independently.\n\nI led the design and customer testing, working with Product and Engineering.\n\nAn early version combined a simpler interface with SQL for writing transformations. Testing showed that users understood what they wanted to do with their data. They could explain the logic using Excel functions, but struggled to express it in SQL. I interpreted that as a mismatch between the product's language and their existing knowledge.\n\nI brought that finding to Product and Engineering. Together, we moved toward guided configuration and extended Abacum's existing modeling language, keeping it close to the spreadsheet concepts users already knew.\n\nWe also addressed friction within the workflow. For example, users had to leave their dataset to create a missing dimension, then return and continue. I proposed letting them create and edit basic dimensions within the dataset, while keeping advanced management separate.\n\nThe changes shipped. We had qualitative reports of customers reaching a working configuration in their first session, and customers reported less confusion and fewer errors after the dimension change. Those were qualitative outcomes, rather than instrumented measurements.\n\nThe central design decision was to build around how finance users already understood their work, rather than asking them to learn a technical language just to complete it.\n\n[pause — let them ask]"}, {"title": "Impact / research changed direction", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Abacum, I led design and customer testing for a tool that helped finance teams configure their own data.\n\nBefore that, they depended on implementation specialists and technical configuration files. The goal was to give them more independence.\n\nOur early direction combined a simpler interface with SQL. But testing showed something important: users could explain the transformation they needed using Excel functions, yet they struggled to express it in SQL.\n\nI took that finding to Product and Engineering. Together, we changed direction and extended the existing modeling language around concepts familiar to finance users.\n\nThe guided workflow shipped. Our recollection was that customers could reach a working configuration in their first session. The implementation team also felt standard setups took roughly half the previous time. That was team feedback, not an analytics measurement.\n\n[pause — let them ask]"}, {"title": "Customer feedback / small change with impact", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Abacum, I identified a problem that forced users to leave the task they were working on.\n\nWhen configuring a dataset, they could assign dimensions to its columns. But if a dimension was missing, they had to leave the dataset, create it somewhere else, and then come back. Customers reported that this caused confusion and errors.\n\nI proposed putting basic dimension creation and editing directly into the open dataset. Product and Engineering agreed to build it.\n\nWe kept advanced management in the separate area, so the first version addressed the immediate workflow problem without moving everything.\n\nThe change shipped, and customers reported faster configuration, fewer errors, and less confusion. We didn't have a measured baseline, so I would describe that as qualitative customer feedback.\n\n[pause — let them ask]"}, {"title": "Pushback / influence / capacity tradeoff", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Abacum, Engineering was concerned that a design system would compete with squad priorities and never make it into production.\n\nI co-led the business case with the Head of Design. We showed examples of inconsistencies across the product and compared different ways to staff the work.\n\nThe team chose a focused Maker Days week. That meant more people stepping away from squad work, but for a shorter period.\n\nMy contribution included the business case and parts of the token and component-library work. Engineering built the original implementation pipeline.\n\nDuring that week, the token setup and the first Button reached production. That gave us concrete evidence that the path from design to code worked. It didn't prove financial return or complete the wider migration.\n\n[pause — let them ask]"}, {"title": "Disagreement / mixed feedback", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Remuner, research on the manager view showed some basic workflow problems. Managers lacked an overview by metric, had to navigate through too many steps, and couldn't easily compare previous periods.\n\nI recommended fixing those problems before doing a broader redesign. The CEO and CTO chose to proceed with the full redesign instead.\n\nI explained my disagreement, then accepted the decision and worked to keep the research findings in the design. That included improving the metric overview and navigation.\n\nThe redesign shipped. Feedback was positive about those improvements, but the overall response was mixed. Some users still struggled to find information they needed.\n\nI captured and analysed that feedback, separating problems that blocked tasks from other friction to guide future iterations. I can't claim that later iterations resolved them.\n\n[pause — let them ask]"}, {"title": "Mistake / accountability / learning", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Remuner, I deleted a token file because I thought it was duplicated. The frontend still depended on it, and the next deployment caused a short production outage.\n\nThe mistake was my assumption that the file was safe to remove.\n\nI restored it and pushed the fix. For the next several days, I manually checked that the required files were present before deployment.\n\nThe team then added a required-file check while the dependency still needed to be cleaned up.\n\nThe service was restored, and the checking process changed. I don't have an exact outage duration or a measured customer impact.\n\nIf I were making that change again, I would verify which parts of the application depend on the file before treating it as a duplicate.\n\n[pause — let them ask]"}, {"title": "AI / scope / trust / zero to one", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Remuner, I designed a conversational agent for questions about commissions and sales plans.\n\nAs the sole designer, I owned the interface, conversation design, answer formats, and design-side boundaries. Engineering owned the technical architecture, and we agreed the scope with the founders. There wasn't a PM on this project.\n\nWe started from the data Engineering could make available. I designed the experience around supported questions, refusals for questions outside that scope, and different contexts for reps and managers.\n\nReps could ask about their own plans. Managers could also ask about their teams. Answers used tables or lists when that made the information easier to understand.\n\nThe agent launched to all customers. Feedback was mixed, and we continued improving tone, terminology, and presentation. I don't have reliable adoption or accuracy metrics, so I wouldn't present the launch as proof that every answer was correct.\n\n[pause — let them ask]"}, {"title": "Vague feedback / clarify the real problem", "group": "Project battle cards", "kind": "answer", "battle": true, "text": "At Remuner, we received feedback that the dashboard for sales reps wasn't intuitive enough. I didn't want to assume that meant we needed to redesign the interface.\n\nI identified the users who had given that feedback and arranged interviews to understand where they were getting stuck.\n\nThe same complaint described different problems. One user didn't understand how their compensation plan was calculated. Another couldn't tell which metrics affected it. A third saw a commission amount but didn't know when they would receive it, because their payout covered a three-month period.\n\nWe compared those findings with our existing evidence and prioritised the problems by severity, focusing on changes that could help users quickly.\n\nAs the sole designer, I designed all of the changes. For example, I added access to a summary of the plan calculation, with a route to the full detail. For quarterly payouts, I designed a period selector and information about payment timing and when the period would close.\n\nThe changes shipped. In testing, users could understand the information they had previously been missing. That gave us qualitative evidence that the changes addressed those specific problems.\n\nThe important point was turning one vague complaint into separate, actionable problems, each with its own solution.\n\n[pause — let them ask]"}, {"title": "First-call priorities", "group": "Reference", "kind": "notes", "text": "Prepare three things first: a concise career overview, a genuine reason for Alan, and two project stories. Jorge confirmed motivation, background and past projects. Behavioral questions are possible follow-ups, not a confirmed list to deliver. The aim of this preparation is to make your experience and decisions easy to follow.\n\nJorge’s email is the authority for this call: motivation, background, and past-project discussion, with English required. Prepare for a first conversation about fit. Celine’s possible designer title does not establish a technical assessment or change the requested format. Do not confuse this first call with the separate “Alaner Fit” stage described in the general guide.\n\nStart with concise spoken answers. Explain project decisions and outcomes if asked, and use the battle cards for follow-ups. A formal deck, design critique, or screen-sharing walkthrough was not requested. Having an existing case handy is optional."}, {"title": "What Alan does — comparison with Sanitas", "group": "Reference", "kind": "notes", "text": "**External research, verified 2026-10-07.** Alan provides health insurance alongside access to care, prevention and ongoing support. Its Spanish offering prominently targets employers: companies buy coverage for their teams, and employees become members. It is more than a layer connecting members with medical centres.\n\nSanitas is a useful comparison. Both offer insurance, access to doctors, apps, teleconsultations and prevention programmes. Alan emphasises bringing insurance, care and prevention together; Sanitas also integrates digital services through Blua and combines its own medical centres with contracted providers. An app or prevention programme alone is not a unique Alan differentiator.\n\nSources: [Alan Spain](https://alan.com/es-es), [Alan health plans](https://alan.com/es-es/seguro-de-salud), [Sanitas Blua](https://www.sanitas.es/seguros/salud-digital-blua), [Sanitas own and contracted care network](https://corporativo.sanitas.es/los-clientes-de-sanitas-tienen-ya-acceso-a-blua-la-salud-digital-de-sanitas/).\n\n**Unknown:** whether Alan delivers simpler navigation, better support or more effective coordination than competitors. The websites establish the offerings and positioning, not comparative performance. Use the interview to understand where its approach produces a different result.\n\nSpeaking cue:\n\n“I’ve been looking at Alan’s offering in Spain. I understand the combination of insurance, care, and prevention, but established insurers also offer digital services. I’d like to understand where Alan makes the biggest difference in practice.”\n\nChoose one or two discovery questions alongside the role questions below:\n\n1. “What makes an employer choose Alan, and what makes an employee value it once they start using it?” — separates buyer needs from member experience.\n2. “Could you walk me through a member journey where Alan’s approach makes a meaningful difference?” — asks for a concrete example beyond positioning.\n3. “Which part of that experience would this designer work on, and what is the biggest unresolved problem there?” — connects the product to the role; overlaps with the first question for Celine below.\n\nOptional follow-ups:\n\n- “Where do members still get confused or need human help, and how does that inform design priorities?”\n- “How do you measure whether a design change improves access to care or understanding, beyond app engagement?”\n\nYou do not need to claim Alan is radically different or better. Show that you understand the overlap and want to learn what matters to its members.\n\n### Countries and local product experiences\n\n**External research, verified 2026-10-07.** Alan operates in France, Belgium, Spain and Canada. International operation is not unique: Sanitas belongs to Bupa, which operates through businesses and brands in multiple countries. Sources: [Alan press room](https://alan.com/en/press-room), [Bupa businesses](https://www.bupa.com/company/about-us/what-we-do).\n\nThe [French](https://apps.apple.com/fr/app/alan-health-insurance/id1277025964) and [Canadian](https://apps.apple.com/ca/app/alan-health-insurance/id1277025964) Apple stores list the same Alan app ID. **Inference:** this supports a shared app distribution model with local experiences. It does not establish the internal architecture, how much functionality is shared, or the arrangement on Android.\n\n**Likely design complexity, not confirmed team scope:** differences in coverage, payments and reimbursements; provider networks and access to care; local requirements and terminology; and decisions about which journeys and components stay shared versus adapt locally. This goes beyond translation. The role's responsibility across markets remains unknown.\n\nQuestions to explore this:\n\n1. “I noticed Alan operates in several countries. How much of the member experience is shared, and where do local healthcare systems require different journeys?”\n2. “Could you give me an example where a country-specific need changed the product design?”\n3. “Would this role work across markets, and how do designers balance shared patterns with local needs?”\n\nUse the second as a follow-up to the first. Choose these alongside the other questions rather than trying to ask every question in the first call."}, {"title": "Before and after", "group": "Reference", "kind": "notes", "text": "Before: check reminder/joining link, camera/audio, and correct time zone; practise opener, genuine motivation, and randomly chosen stories aloud. Keep two relevant case pages ready. Do not claim rehearsal complete just because files are ready.\n\nAfter: record what was discussed, role scope, salary/level information, next step, and any requested preparation. Attendance and outcomes remain unconfirmed until you report them."}, {"title": "Sources and boundaries", "group": "Reference", "kind": "notes", "text": "- [Alan application record](../../applications/records/alan-product-designer.md): Jorge’s emails and current appointment.\n- [Experience register](../../evidence/experience-facts.md), re-read 2026-10-07: ownership, broad remit, mentoring, departure, results and limits.\n- [Detailed story bank](../datavant/datavant-star-examples.md): supporting historical details; current register takes precedence.\n- [Positioning](../../context/positioning.md), [target roles](../../context/target-roles.md), [compensation](../../context/salary.md), [writing rules](../../context/writing-rules.md).\n- Official [hiring-process guide](https://alan.com/en/careers/a/hiring-process-step-by-step), checked 2026-10-06: screening covers role/history/next step and motivation; later stages vary by role. Exact design sequence remains unknown.\n- Official [compensation policy](https://alan.com/en/careers/a/salary-equity), checked 2026-10-06: assessed level determines salary/equity; France/Spain grid is published; final offer is binding. Guide says level is non-negotiable once decided. Numeric grid values were not verified."}, {"title": "Meeting details", "group": "Reference", "text": "**Friday 9 October 2026 · 12:15 Europe/Madrid (CEST) · Celine Brunel · allow 30–45 minutes.** Video-call link will arrive in reminder. All or part will be in English; prepare in English throughout.\n\nConfirmed scope: motivation, background, past-project walkthroughs, from Jorge’s confirmation supplied 2026-10-06. Manel believes Celine is a Senior Product Designer; independent verification on 2026-10-09 was inconclusive. Her title and the exact portfolio format remain unconfirmed. A deck was not requested in the supplied email.\n\n[Local interview reader](alan-reader.html) includes the spoken answers and the rest of this brief. [Textream version](../textream/alan-first-meeting.textream) contains the spoken pages. Use one page per story; app testing and spoken rehearsal remain pending.\n\nKeep the [behavioral selector and cue cards](../behavioral-battle-cards.md) open during rehearsal. Keep only the selector and chosen card visible during the call; avoid scrolling through the full reference bank."}, {"title": "Evidence and follow-up cues", "group": "Reference", "text": "# Behavioral interview battle cards\n\nPrepared 2026-10-06. English cues for Alan and future interviews. These are retrieval aids, not approved verbatim answers. Sources: [experience register](../evidence/experience-facts.md) and [existing detailed story bank](datavant/datavant-star-examples.md). Current evidence supersedes older wording.\n\n## Keep this selector visible\n\n| What they ask | Choose | Memory chain |\n| --- | --- | --- |\n| Impact / research changed your mind / complex problem | A · Dataset Manager | Dependence → test → familiar language → working setup |\n| Customer feedback / small change with impact / simplify a workflow | B · Dimensions | Leave task → embed basics → keep advanced separate → feedback |\n| Pushback / influence / competing priorities | C · Maker Days | Capacity concern → co-led case → bounded week → production Button |\n| Disagreement / mixed feedback / support a decision you challenged | D · Manager view | Workflow first → leadership chose redesign → preserve findings → mixed result |\n| Failure / accountability / what you learned | E · Token file | Wrong assumption → outage → restore → required-file check |\n| AI / ambiguity / trust / zero to one | F · AI agent | Pay questions → roles and limits → structured answers → launch, limits remain |\n| Vague feedback you had to clarify | G · IC dashboard | Not intuitive → interview users → different causes → prioritise and test |\n| Mentoring someone / helping them improve | Not yet a story | Mentoring confirmed; individual episode and result still needed |\n\n## Answer shape: headline + four anchors\n\nTake a breath, choose an episode, then open with why it fits: “A good example is …, where …”. Give **context → my responsibility → actions and why → result**. Aim for 60–90 seconds for the first answer; extend only when asked. Keep context to one or two sentences and spend most time on your decisions.\n\nName the result even when it is mixed. End there and let them ask a follow-up. “I” means your contribution; “we” means a shared decision or delivery.\n\nIf the prompt is unclear: “When you say impact, do you mean the customer outcome or the wider team impact?”\nIf you need a moment: “Let me think of a specific example.”\nIf you lose the thread: “Let me simplify that. The problem was … My contribution was … What changed was …”\nIf you have an adjacent story: “I have a related example, although it wasn’t feedback from a PM. Would that be useful?”\nIf you have no matching incident: say so. For a hypothetical question, explain what you would do; do not turn that into something you did.\n\n## A · Dataset Manager — impact and changing direction\n\n**Opener:** “At Abacum, testing changed our direction for a self-service data-configuration tool.”\n\n- **Context:** Finance users depended on specialists and JSON configuration; autonomy was the goal.\n- **My responsibility:** Led design and customer testing.\n- **Actions / why:** Tested simpler UI plus SQL → users could express the logic in Excel but not SQL → took finding to Product and Engineering → team extended the familiar modeling language and guided configuration.\n- **Result:** Shipped. Customers could reach working configuration in their first session; implementation team recalled standard setup taking roughly half the previous time.\n\n**Evidence boundary:** Outcomes are recollection, not analytics. Do not say “I reduced time by 50%” or infer revenue, support-ticket reduction, or numeric user scale.\n**Likely probes:** What changed your mind? What did you personally do? How did you know it helped?\n**Detail in reserve:** Familiar language was the important change; a simpler visual layer alone was insufficient.\n**Reflection prompt:** What would you measure now to distinguish completion from real independence? Frame proposed instrumentation as what you would do, not a historical action.\n\n## B · Dimensions — a specific customer-feedback loop\n\n**Opener:** “One useful change was letting users create a missing dimension without leaving the dataset they were configuring.”\n\n- **Context:** Leave dataset → create dimension elsewhere → return and resume; customers reported friction, errors, confusion.\n- **My responsibility:** Identified the workflow problem and proposed the change.\n- **Actions / why:** Put basic creation/editing into the current task → Product and Engineering agreed → kept advanced management separate to limit first-version scope.\n- **Result:** Shipped; customers reported faster configuration, fewer errors, and less confusion.\n\n**Evidence boundary:** Qualitative customer reports; no baseline, sample size, or measured reduction. This supports responding to feedback, not clarifying vague feedback.\n**Likely probes:** Why not move everything? What feedback followed? How did you identify the problem?\n**Detail in reserve:** Dimensions subsequently supported aggregation/modeling; ownership of later advanced work is not established.\n\n## C · Maker Days — influence and capacity tradeoff\n\n**Opener:** “At Abacum, we addressed Engineering’s capacity concern with a bounded production test for the design system.”\n\n- **Context:** Engineering worried the system would compete with squad work and never reach production.\n- **My responsibility:** Co-led business case with Head of Design; contributed token/library work. Engineering built original pipeline.\n- **Actions / why:** Showed inconsistencies → compared staffing approaches → team chose one focused Maker Days week, more concentrated participation for less time.\n- **Result:** Tokens and first Button reached production; proved the design-to-code path worked.\n\n**Evidence boundary:** Shared influence and decision. No measured ROI or delivery-speed claim. Do not invent a PM conflict or sole engineering implementation.\n**Likely probes:** What objection did they raise? Why a week? What did you give up?\n**Detail in reserve:** Squad delivery capacity was the cost. This was a small proof before broader adoption, not completion of the migration.\n\n## D · Manager view — disagree, deliver, assess honestly\n\n**Opener:** “At Remuner, I disagreed with a full redesign, but worked to keep the research findings in the direction leadership chose.”\n\n- **Context:** Managers lacked an overview by metric, navigated too many nested steps, and could not easily see previous-period information.\n- **My responsibility:** Research/design recommendation; proposed fixing foundational workflow and architecture first.\n- **Actions / why:** Stated disagreement → CEO/CTO chose full redesign → accepted decision and retained the main findings in metric overview and navigation changes → captured feedback and separated blocking problems from other friction.\n- **Result:** Shipped; positive feedback on overview/navigation, mixed response overall, including difficulty finding information.\n\n**Evidence boundary:** Qualitative personal account. Do not say later iterations solved the problems; no later release/result confirmed. Leadership disagreement was not a PM disagreement.\n**Likely probes:** What was your alternative? How did you act after the decision? What did negative feedback change?\n**Detail in reserve:** Analysis informed future iteration priorities; it does not establish that those iterations shipped.\n\n## E · Token file — a mistake you owned\n\n**Opener:** “I deleted a token file I thought was duplicated, and the next deployment caused a short production outage.”\n\n- **Context:** Frontend still depended on the file; my assumption was wrong.\n- **My responsibility:** Own deletion and mistaken dependency assumption.\n- **Actions / why:** Restored file and pushed fix → manually checked required files for several days → team added required-file presence check pending dependency cleanup.\n- **Result:** Service restored; safeguard introduced.\n\n**Evidence boundary:** No exact outage duration or customer count. Automation and completed dependency cleanup are not confirmed. Do not merge separate pipeline hardening into this incident.\n**Likely probes:** Why did you delete it? What would you do differently? What changed afterward?\n**Reflection prompt:** Explain how you would verify consumers/dependencies before removing a supposedly duplicate file. This is a lesson to articulate, not evidence you performed a particular technical audit then.\n\n## F · AI agent — scope and trust under uncertainty\n\n**Opener:** “At Remuner, I designed a conversational agent for questions about commissions and sales plans.”\n\n- **Context:** Reps and managers needed understandable answers about pay; different roles had different access.\n- **My responsibility:** UX/UI, conversation design, answer formats, role-based context and design-side boundaries.\n- **Actions / why:** Engineering established available data → agreed scope with founders/Engineering → designed supported questions/refusals and contextual answers, tables/lists where useful → iterated tone, terminology, presentation after launch.\n- **Result:** Released to all customers before March 2026; mixed feedback and continued iteration, without reliable adoption/accuracy/business metrics.\n\n**Evidence boundary:** No PM on this project. Engineering owned architecture. Wrong numbers could arise when customer-specific calculation code was outside agent context; recorded resolution is unclear. Do not claim guaranteed correctness or that chat exposed data freshness.\n**Likely probes:** What was out of scope? How did you assess accuracy? What did you personally own?\n**Detail in reserve:** No complaint/follow-up was a weak operational signal, not ground truth.\n\n## G · IC dashboard — turn vague feedback into specific problems\n\nUpdated from Manel’s direct account, 2026-10-09. [Readable answer](textream/07-vague-feedback-ic-dashboard.txt).\n\n**Opener:** “At Remuner, users said the rep dashboard wasn’t intuitive, but interviews showed they meant different things.”\n\n- **Context:** “Not intuitive” did not identify whether the problem was UI, missing information, or understanding compensation.\n- **My responsibility:** Identified feedback-givers, arranged interviews, and designed all the changes as sole designer.\n- **Actions / why:** Found calculation-understanding, metric-relationship and quarterly-payment timing problems → team compared with existing evidence → prioritised severity and useful changes → added calculation summary/full-detail access and period/payment information → tested with users.\n- **Result:** Changes shipped. In testing, users understood the information they had previously been missing; qualitative evidence, without quantified impact.\n\n**Evidence boundary:** Qualitative direct account, no measured effect. Personal research and full design ownership confirmed; prioritisation and implementation were shared. No specific metric-relationship solution recorded. Do not merge with manager-view redesign or assume the same iteration as the earlier progressive-disclosure example.\n**Likely probes:** What did you ask? How did you prioritise? What did testing show? Did it ship?\n**Memory chain:** Vague complaint → different causes → targeted changes → user testing.\n\n## Rehearsal\n\nPractise the selector, not six memorised speeches. Ask prompts in random order; choose the card within a few seconds and answer without reading it. Start with impact, vague feedback, disagreement, failure, then AI.\n\nAfter each answer, check: Did I answer the actual question? Can a listener repeat the problem, my contribution, decision and result? Did I explain why? Did I overclaim? Retry only the weak part.\n\nUseful probe rotation: “What did you personally do?” / “What evidence supported that?” / “What was the alternative?” / “What happened next?”\n\nCards are prepared. Spoken rehearsal and listener comprehension have not yet been verified.\n"}]</script>
<script>
let items=JSON.parse(document.getElementById('data').textContent),selected=0,size=24;
const $=id=>document.getElementById(id),escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return escape(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>{const decoded=url.replace(/&amp;/g,'&');return /^(https?:|\.\.?\/|[a-zA-Z0-9_-]+\.)/.test(decoded)?`<a href="${url}" target="_blank" rel="noopener">${label}</a>`:label}).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function render(text){let blocks=text.split(/\n\s*\n/);return blocks.map(block=>{let lines=block.trim().split('\n');if(!block.trim())return '';if(lines[0].startsWith('|')){let rows=lines.filter(l=>!/^\|[\s:|-]+\|$/.test(l));return '<table>'+rows.map((l,i)=>'<tr>'+l.split('|').slice(1,-1).map(c=>`<${i?'td':'th'}>${inline(c.trim())}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>'}if(lines.every(l=>/^[-*] /.test(l)))return '<ul>'+lines.map(l=>'<li>'+inline(l.slice(2))+'</li>').join('')+'</ul>';if(lines.every(l=>/^\d+\. /.test(l)))return '<ol>'+lines.map(l=>'<li>'+inline(l.replace(/^\d+\. /,''))+'</li>').join('')+'</ol>';return lines.map(l=>/^#{1,6} /.test(l)?'<h3>'+inline(l.replace(/^#{1,6} /,''))+'</h3>':/^\[.*\]$/.test(l)?'<p class="cue">'+escape(l.slice(1,-1))+'</p>':'<p>'+inline(l)+'</p>').join('')}).join('')}
function filtered(){const q=$('search').value.toLowerCase();return items.map((v,i)=>i).filter(i=>(items[i].title+' '+items[i].text).toLowerCase().includes(q))}
function nav(){const list=filtered();$('nav').replaceChildren();let group='';for(const i of list){if(items[i].group!==group){group=items[i].group;let label=document.createElement('div');label.className='group';label.textContent=group;$('nav').append(label)}let b=document.createElement('button');if(items[i].battle){const badge=document.createElement('span');badge.className='battle-mark';badge.textContent='BC';badge.title='Battle card';b.append(badge);const label=document.createElement('span');label.textContent=items[i].title;b.append(label)}else{b.textContent=items[i].title}b.setAttribute('aria-current',String(selected===i));b.onclick=()=>select(i);$('nav').append(b)}if(!list.length){let e=document.createElement('p');e.className='empty';e.textContent='No matching sections';$('nav').append(e)}}
function select(i){selected=i;const v=items[i];$('title').textContent=v.title;$('tag').textContent=v.battle?'Battle card · project story':v.kind==='answer'?'About me · spoken answer':v.group==='Interview'?'Interview · questions and cues':'Reference · preparation notes';$('article').className=v.group==='Reference'?'reference':'';$('body').innerHTML=render(v.text);$('viewport').scrollTop=0;nav()}
$('search').oninput=nav;$('larger').onclick=()=>{size=Math.min(36,size+2);document.documentElement.style.setProperty('--size',size+'px')};$('smaller').onclick=()=>{size=Math.max(18,size-2);document.documentElement.style.setProperty('--size',size+'px')};$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light':'Dark'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(items[selected].text);$('copy').textContent='Copied'}catch{let r=document.createRange();r.selectNodeContents($('body'));getSelection().removeAllRanges();getSelection().addRange(r);$('copy').textContent='Selected · press ⌘C'}setTimeout(()=>$('copy').textContent='Copy text',2200)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('search').value='';nav();$('search').blur()}if(e.target.matches('input,button')||e.metaKey||e.ctrlKey||e.altKey)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){const list=filtered(),p=list.indexOf(selected),next=list[p+(e.key==='ArrowRight'?1:-1)];if(next!==undefined){e.preventDefault();select(next)}}});
$('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.length||!data.every(x=>typeof x==='string'))throw Error('Expected a nonempty array of page texts');items=[...data.map(p=>({title:p.split('\n')[0].replace(/^\[|\]$/g,''),group:['Tell me about yourself','Why Alan','Working with Product and Engineering','Why did you leave Remuner?'].includes(p.split('\n')[0].replace(/^\[|\]$/g,''))?'About me':'Project battle cards',battle:!['Tell me about yourself','Why Alan','Working with Product and Engineering','Why did you leave Remuner?'].includes(p.split('\n')[0].replace(/^\[|\]$/g,'')),kind:'answer',text:p.split('\n').slice(1).join('\n').trim()})),...items.filter(x=>x.kind!=='answer')];items.sort((a,b)=>['About me','Interview','Project battle cards','Reference'].indexOf(a.group)-['About me','Interview','Project battle cards','Reference'].indexOf(b.group));$('search').value='';select(0)}catch(err){alert('Could not read that Textream file: '+err.message)}finally{e.target.value=''}};
select(0);
</script>

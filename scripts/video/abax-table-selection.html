<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abax table selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Values copied from Figma "Abacum | Abax Components | Exploration", page "2306 -> Table cells" (June 2023).
   Drag and drop variant: boards "Table - Column" and "Table - Row" (Drag & drop). The drag itself follows
   Notion's table pattern (Manel, 2026-11-17); the boards do not draw it.
   Video copy of interviews/perk/perk-table-selection-rebuild.html (2026-11-19): no label, the empty
   43 px column removed, expanders only in the first column, the range box follows the pointer and
   settles on the cells at release, and a tight 780x488 frame with the table under the variant switch. */
:root {
  --line: #e8eaec;
  --line-strong: #dbdee0;
  --text: #141719;
  --text-num: #222200;
  --text-muted: #707880;
  --grip: #bdc4c7;
  --chip-bg: #ffefe0;
  --chip-border: #ffe8d1;
  --chip-text: #914b00;
  --sel: #0078b2;
  --sel-fill: #ebf8ff;
  --row-line: rgba(0, 19, 38, 0.09);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #ffffff; }
body {
  font-family: Inter, system-ui, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}
body.grab { cursor: grab; }
body.grabbing, body.grabbing * { cursor: grabbing !important; }
.label { position: fixed; top: 28px; left: 32px; font-size: 14px; color: #6b6b6b; }
.mode { position: fixed; top: 16px; right: 60px; display: flex; gap: 4px; font: 13px 'Plus Jakarta Sans', sans-serif; }
.mode button {
  font: inherit; color: #6b6b6b; background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 4px 10px; cursor: pointer;
}
.mode button[aria-pressed="true"] { color: var(--text); border-color: var(--line); }
#stage { position: absolute; left: 60px; top: 56px; width: 659px; height: 408px; transform-origin: center center; }
.table {
  position: relative; width: 659px; height: 408px;
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff;
}
.grid { display: flex; height: 360px; position: relative; }
.col { display: flex; flex-direction: column; background: #fff; }
.cell {
  height: 40px; flex: none; position: relative; display: flex; align-items: center;
  font-size: 14px; line-height: 20px; background: #fff;
  box-shadow: inset 0 -1px 0 var(--row-line), inset -1px 0 0 var(--row-line);
  white-space: nowrap;
}
.col.last .cell { box-shadow: inset 0 -1px 0 var(--row-line); }
.head { font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); padding-left: 12px; box-shadow: inset 0 -1px 0 var(--line-strong), inset -1px 0 0 var(--row-line); }
.col.last .head { box-shadow: inset 0 -1px 0 var(--line-strong); }
.mapping { padding: 0 8px; justify-content: space-between; }
.chip { height: 24px; padding: 0 4px; line-height: 22px; border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--chip-text); border-radius: 4px; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.chev-down { width: 24px; height: 24px; display: grid; place-items: center; }
.body.plain { padding-left: 12px; }
.body .ico { width: 24px; height: 24px; margin-left: 12px; margin-right: 8px; display: grid; place-items: center; flex: none; }
.num { justify-content: flex-end; padding-right: 12px; color: var(--text-num); }
.footer {
  height: 48px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: flex-end;
  font-size: 12px; line-height: 14px; padding-right: 12px;
}
.footer .muted { color: var(--text-muted); }
.footer .rpp { display: flex; align-items: center; margin-right: 27px; }
.footer .rpp b { font-weight: 400; margin-left: 7px; }
.footer .pages { margin-right: 33px; }
.footer .nav { display: flex; gap: 24px; }

/* Overlays */
.glide .box, .glide .hl#selHl { transition: left 140ms cubic-bezier(.2,.7,.2,1), top 140ms cubic-bezier(.2,.7,.2,1), width 140ms cubic-bezier(.2,.7,.2,1), height 140ms cubic-bezier(.2,.7,.2,1); }
.ov { position: absolute; pointer-events: none; display: none; }
.hl { background: var(--sel-fill); mix-blend-mode: multiply; }
.box { border: 1px solid var(--sel); }
.handle { position: absolute; width: 8px; height: 8px; background: var(--sel); }

/* Indicator, no drag and drop: 12px circle */
.ind { position: absolute; pointer-events: none; display: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1px solid var(--line-strong); }
.ind.hot { border-color: var(--sel); }
.ind.on { background: var(--sel); border-color: var(--sel); }
.ind svg { display: none; }
/* Indicator, drag and drop: grip handle, 24x16 on the top edge, 16x24 on the left edge, radius 4 */
.dnd .ind { border-radius: 4px; display: none; place-items: center; }
.dnd .ind.top { width: 24px; height: 16px; }
.dnd .ind.left { width: 16px; height: 24px; }
.dnd .ind svg { display: block; fill: var(--grip); }
.dnd .ind.hot svg { fill: var(--sel); }
.dnd .ind.on { border-color: var(--sel); }
.dnd .ind.on svg { fill: #fff; }

/* Drag: a faded copy follows the pointer on one axis, a line marks the drop position */
.ghost { position: absolute; pointer-events: none; border: 1px solid var(--sel); overflow: hidden; background: #fff; }
.ghost .col, .ghost .cell { background: transparent; }
.ghost .cell { box-shadow: none; opacity: 0.6; }
.ghost.row { display: flex; height: 41px; }
.ghost::after { content: ""; position: absolute; inset: 0; background: var(--sel-fill); mix-blend-mode: multiply; }
.drop { position: absolute; pointer-events: none; display: none; background: var(--sel); }
</style>
</head>
<body>
<div class="mode" role="group" aria-label="Variant">
  <button id="mNo" aria-pressed="true">No drag &amp; drop</button>
  <button id="mDnd" aria-pressed="false">Drag &amp; drop</button>
</div>

<div id="stage">
  <div class="table" id="table">
    <div class="grid" id="grid"></div>
    <div class="footer">
      <span class="rpp"><span class="muted">Rows per page:</span><b>8</b>
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="#707880"/></svg></span>
      <span class="pages">1-8 of 248</span>
      <span class="nav">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z" fill="#707880"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M8.6 16.6L10 18l6-6-6-6-1.4 1.4 4.6 4.6z" fill="#141719"/></svg>
      </span>
    </div>
  </div>

  <!-- overlays, in table coordinates (0,0 = table top-left) -->
  <div class="ov hl" id="hoverHl"></div>
  <div class="ov hl" id="selHl"></div>
  <div class="ov box" id="selBox">
    <div class="handle" id="hTL" style="left:-5px;top:-5px"></div>
    <div class="handle" id="hBR" style="right:-5px;bottom:-5px"></div>
  </div>
  <div class="drop" id="drop"></div>
  <div class="ind top" id="colInd"></div>
  <div class="ind left" id="rowInd"></div>
  <div class="ind top on" id="colIndSel"></div>
  <div class="ind left on" id="rowIndSel"></div>
</div>

<script>
// ---- Table content: an illustrative general ledger export (fake data, 2026-11-19) ----
const ROWS_DATA = [
  ['Sep-21', '6100', 'Advertising', 'Marketing', '12,480.00'],
  ['Sep-21', '6120', 'Software', 'Engineering', '3,215.40'],
  ['Sep-21', '6200', 'Salaries', 'Sales', '48,920.75'],
  ['Sep-21', '6210', 'Contractors', 'Customer Success', '7,860.10'],
  ['Sep-21', '6300', 'Travel', 'Sales', '1,245.00'],
  ['Sep-21', '6400', 'Office rent', 'Finance', '22,310.55'],
  ['Sep-21', '6410', 'Insurance', 'People', '935.20'],
  ['Sep-21', '6500', 'Events', 'Marketing', '15,600.00'],
];
const chevR = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M7.5 5.5 12 10l-4.5 4.5" fill="none" stroke="#738087" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const chevD = '<span class="chev-down"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6.5 9.5 12 15l5.5-5.5" fill="none" stroke="#222200" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
// Mapped columns show the dimension they map to as a chip.
const mapping = label => `<div class="cell head mapping"><span class="chip">${label}</span>` + chevD + '</div>';
const textCell = t => r => `<div class="cell body"><span class="ico">${chevR}</span>${t(r)}</div>`;
const plainCell = t => r => `<div class="cell body plain">${t(r)}</div>`;
const COLS = [
  { w: 120, head: mapping('Date'), cell: textCell(r => ROWS_DATA[r][0]) },
  { w: 120, head: '<div class="cell head">Account</div>', cell: plainCell(r => ROWS_DATA[r][1]) },
  { w: 120, head: '<div class="cell head">Name</div>', cell: plainCell(r => ROWS_DATA[r][2]) },
  { w: 157, head: mapping('Department'), cell: plainCell(r => ROWS_DATA[r][3]) },
  { w: 142, head: '<div class="cell head">Amount (EUR)</div>', cell: r => `<div class="cell body num">${ROWS_DATA[r][4]}</div>` },
];
const HEAD_H = 40, ROW_H = 40, ROWS = 8, BODY_H = HEAD_H + ROWS * ROW_H, TW = 659;
let colOrder = [0, 1, 2, 3, 4];
let rowOrder = [0, 1, 2, 3, 4, 5, 6, 7];
let X = [], W = [];

const $ = id => document.getElementById(id);
const grid = $('grid');

function render() {
  W = colOrder.map(k => COLS[k].w);
  X = W.map((_, i) => W.slice(0, i).reduce((a, b) => a + b, 0));
  grid.innerHTML = colOrder.map((k, i) =>
    `<div class="col${i === colOrder.length - 1 ? ' last' : ''}" data-c="${k}" style="width:${COLS[k].w}px">${COLS[k].head}` +
    rowOrder.map(r => COLS[k].cell(r).replace('<div class="cell', `<div data-r="${r}" class="cell`)).join('') + '</div>'
  ).join('');
}
render();

// Grip icon from the boards: six 3.33px dots, 2 x 3, rotated on the top edge.
const dots = (rot) => {
  const pts = [];
  for (const a of [1.67, 6.67]) for (const b of [1.67, 6.67, 11.67]) pts.push(rot ? [b, a] : [a, b]);
  const w = rot ? 13.33 : 8.33, h = rot ? 8.33 : 13.33;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.67"/>`).join('')}</svg>`;
};
for (const id of ['colInd', 'colIndSel']) $(id).innerHTML = dots(true);
for (const id of ['rowInd', 'rowIndSel']) $(id).innerHTML = dots(false);

// ---- Variant switch ----
let dnd = location.hash === '#dnd';
function setMode(v) {
  dnd = v;
  $('stage').classList.toggle('dnd', dnd);
  $('mNo').setAttribute('aria-pressed', String(!dnd));
  $('mDnd').setAttribute('aria-pressed', String(dnd));
  history.replaceState(null, '', dnd ? '#dnd' : '#');
  colOrder = [0, 1, 2, 3, 4]; rowOrder = [0, 1, 2, 3, 4, 5, 6, 7]; render();
  sel = { kind: null }; renderSelection(); renderHover(null);
}
$('mNo').onclick = () => setMode(false);
$('mDnd').onclick = () => setMode(true);

// ---- Real size (1:1 with the boards); shrink only when the window is too small ----
const stage = $('stage');
let S = 1;
function fit() {
  S = Math.min((innerWidth - 64) / TW, (innerHeight - 64) / 408, 1);
  stage.style.transform = `scale(${S})`;
}
fit(); addEventListener('resize', fit);

const place = (el, x, y, w, h) => { el.style.display = el.classList.contains('ind') && dnd ? 'grid' : 'block'; el.style.left = x + 'px'; el.style.top = y + 'px'; if (w != null) { el.style.width = w + 'px'; el.style.height = h + 'px'; } };
const hide = el => { el.style.display = 'none'; };
const rowTop = r => HEAD_H + r * ROW_H;

// Indicator placement: circle centred on the edge, or grip handle straddling it.
const colIndAt = (el, c) => dnd ? place(el, X[c] + W[c] / 2 - 12, -8) : place(el, X[c] + W[c] / 2 - 6, -6);
const rowIndAt = (el, top, h) => dnd ? place(el, -8, top + h / 2 - 12) : place(el, -6, top + h / 2 - 6);

// Selection state, in display positions. kind: null | 'cell' | 'header' | 'column' | 'row'
let sel = { kind: null };
let rangeDrag = null, move = null;

function colAt(x) { for (let i = W.length - 1; i >= 0; i--) if (x >= X[i]) return x < X[i] + W[i] ? i : -1; return -1; }

// Hover zones from the boards: zone 3 = the indicator, zone 2 = the rest of the 16px edge strip,
// zone 1 = the header cell (columns) or the first cell of the row (rows).
function hitTest(x, y) {
  const c = colAt(x);
  if (y >= -8 && y < 8 && c >= 0) {
    const cx = X[c] + W[c] / 2;
    return { zone: Math.abs(x - cx) <= 12 ? 'col3' : 'col2', c };
  }
  if (y >= 8 && y < HEAD_H && c >= 0) return { zone: 'col1', c };
  if (y >= HEAD_H && y < BODY_H) {
    const r = Math.floor((y - HEAD_H) / ROW_H);
    const cy = rowTop(r) + ROW_H / 2;
    if (x >= -8 && x < 9) return { zone: Math.abs(y - cy) <= (dnd ? 12 : 8) ? 'row3' : 'row2', r };
    if (c === 0) return { zone: 'row1', r, c };
    if (c > 0) return { zone: 'cell', r, c };
  }
  return null;
}

function local(e) {
  const b = $('table').getBoundingClientRect();
  return { x: (e.clientX - b.left) / S, y: (e.clientY - b.top) / S };
}

function renderSelection() {
  const hl = $('selHl'), box = $('selBox');
  hide(hl); hide(box); hide($('colIndSel')); hide($('rowIndSel'));
  $('hTL').style.display = $('hBR').style.display = 'none';
  if (!sel.kind) return;
  let x, y, w, h;
  if (sel.kind === 'cell') {
    const c0 = Math.min(sel.c0, sel.c1), c1 = Math.max(sel.c0, sel.c1);
    const r0 = Math.min(sel.r0, sel.r1), r1 = Math.max(sel.r0, sel.r1);
    x = X[c0] - 1; y = rowTop(r0) - 1; w = X[c1] + W[c1] - X[c0] + 1; h = (r1 - r0 + 1) * ROW_H + 1;
    if (sel.free) {
      // While dragging the handle, the box runs from the anchor cell to the pointer.
      const a = sel.anchor, px = Math.min(Math.max(sel.free.x, X[1]), TW), py = Math.min(Math.max(sel.free.y, HEAD_H), BODY_H);
      const x0 = Math.min(X[a.c], px), x1 = Math.max(X[a.c] + W[a.c], px);
      const y0 = Math.min(rowTop(a.r), py), y1 = Math.max(rowTop(a.r) + ROW_H, py);
      x = x0 - 1; y = y0 - 1; w = x1 - x0 + 1; h = y1 - y0 + 1;
    }
    $('hTL').style.display = $('hBR').style.display = 'block';
  } else if (sel.kind === 'header') {
    x = X[sel.c] - 1; y = 0; w = W[sel.c] + 1; h = HEAD_H;
  } else if (sel.kind === 'column') {
    x = X[sel.c] - 1; y = 0; w = W[sel.c] + 1; h = BODY_H;
    colIndAt($('colIndSel'), sel.c);
  } else if (sel.kind === 'row') {
    x = 0; y = rowTop(sel.r) - 1; w = TW; h = ROW_H + 1;
    if (sel.ind) rowIndAt($('rowIndSel'), rowTop(sel.r), ROW_H);
  }
  place(hl, x, y, w, h); place(box, x, y, w, h);
}

function renderHover(t) {
  const hl = $('hoverHl'), ci = $('colInd'), ri = $('rowInd');
  hide(hl); hide(ci); hide(ri); ci.classList.remove('hot'); ri.classList.remove('hot');
  document.body.classList.toggle('grab', !!t && dnd && (t.zone === 'col3' || t.zone === 'row3'));
  if (!t) return;
  // Indicators follow the mouse: on the top edge of the hovered column, on the left edge of the hovered row.
  const c = t.c ?? (t.zone.startsWith('row') ? 0 : null);
  const r = t.r ?? (t.zone.startsWith('col') ? -1 : null);
  if (c != null && !(sel.kind === 'column' && sel.c === c)) colIndAt(ci, c);
  if (r != null && !(sel.kind === 'row' && sel.ind && sel.r === r)) {
    if (r < 0) rowIndAt(ri, 0, HEAD_H); else rowIndAt(ri, rowTop(r), ROW_H);
  }
  if (t.zone === 'col3') ci.classList.add('hot');
  if (t.zone === 'row3') ri.classList.add('hot');

  let box = null;
  if (t.zone === 'cell') box = [X[t.c], rowTop(t.r), W[t.c] - 1, ROW_H - 1];
  if (t.zone === 'row1') box = [X[0] + 1, rowTop(t.r), W[0] - 2, ROW_H - 1];
  if (t.zone === 'col1') box = [X[t.c], 1, W[t.c] - 1, HEAD_H - 2];
  if (t.zone === 'col2' || t.zone === 'col3') box = [X[t.c], 1, W[t.c] - 1, BODY_H - 2];
  if (t.zone === 'row2' || t.zone === 'row3') box = [1, rowTop(t.r), TW - 2, ROW_H - 1];
  if (box && !covered(t)) place(hl, ...box);
}

// No hover highlight on top of what is already selected.
function covered(t) {
  if (!sel.kind) return false;
  if (sel.kind === 'cell' && t.zone === 'cell') {
    const inR = t.r >= Math.min(sel.r0, sel.r1) && t.r <= Math.max(sel.r0, sel.r1);
    const inC = t.c >= Math.min(sel.c0, sel.c1) && t.c <= Math.max(sel.c0, sel.c1);
    return inR && inC;
  }
  if (sel.kind === 'column' && t.c === sel.c && t.zone !== 'row1') return true;
  if (sel.kind === 'header' && t.zone === 'col1' && t.c === sel.c) return true;
  if (sel.kind === 'row' && t.r === sel.r) return true;
  return false;
}

function onRangeHandle(p) {
  if (sel.kind !== 'cell') return false;
  const c1 = Math.max(sel.c0, sel.c1), r1 = Math.max(sel.r0, sel.r1);
  return Math.abs(p.x - (X[c1] + W[c1])) <= 7 && Math.abs(p.y - (rowTop(r1) + ROW_H)) <= 7;
}

// ---- Drag and drop (Notion pattern): faded copy follows the pointer, a line marks the drop slot ----
function startMove(axis, index, p) {
  const ghost = document.createElement('div');
  ghost.className = 'ghost' + (axis === 'row' ? ' row' : '');
  if (axis === 'col') {
    const src = grid.children[index].cloneNode(true);
    ghost.appendChild(src);
    Object.assign(ghost.style, { left: X[index] - 1 + 'px', top: '0px', width: W[index] + 1 + 'px', height: BODY_H + 'px' });
  } else {
    [...grid.children].forEach((col, i) => {
      const cell = col.children[index + 1].cloneNode(true);
      cell.style.width = W[i] + 'px';
      ghost.appendChild(cell);
    });
    Object.assign(ghost.style, { left: '0px', top: rowTop(index) - 1 + 'px', width: TW + 'px' });
  }
  ghost.style.display = 'none';
  stage.appendChild(ghost);
  move = { axis, from: index, start: p, ghost, offset: axis === 'col' ? p.x - X[index] : p.y - rowTop(index), slot: null, live: false };
}

function slotFor(axis, p) {
  if (axis === 'col') {
    for (let i = 0; i < W.length; i++) if (p.x < X[i] + W[i] / 2) return i;
    return W.length;
  }
  const r = Math.round((p.y - HEAD_H) / ROW_H);
  return Math.max(0, Math.min(ROWS, r));
}

function dragMove(p) {
  const m = move;
  if (!m.live) {
    if (Math.hypot(p.x - m.start.x, p.y - m.start.y) < 4) return;
    m.live = true; m.ghost.style.display = m.axis === 'row' ? 'flex' : 'block';
    document.body.classList.add('grabbing'); renderHover(null);
  }
  const drop = $('drop');
  if (m.axis === 'col') {
    m.ghost.style.left = Math.max(-40, Math.min(TW - W[m.from] + 40, p.x - m.offset)) - 1 + 'px';
    m.slot = slotFor('col', p);
    const noop = m.slot === m.from || m.slot === m.from + 1;
    if (noop) hide(drop); else place(drop, (m.slot < W.length ? X[m.slot] : TW) - 1, 0, 2, BODY_H);
  } else {
    m.ghost.style.top = Math.max(HEAD_H - 20, Math.min(BODY_H - 20, p.y - m.offset)) - 1 + 'px';
    m.slot = slotFor('row', p);
    const noop = m.slot === m.from || m.slot === m.from + 1;
    if (noop) hide(drop); else place(drop, 0, rowTop(m.slot) - 1, TW, 2);
  }
}

function endMove(cancel) {
  const m = move; move = null;
  m.ghost.remove(); hide($('drop')); document.body.classList.remove('grabbing');
  if (cancel || !m.live || m.slot == null || m.slot === m.from || m.slot === m.from + 1) return;
  const to = m.slot > m.from ? m.slot - 1 : m.slot;
  // FLIP: remember where each column or cell was, reorder, then animate from the old place.
  const before = new Map();
  grid.querySelectorAll(m.axis === 'col' ? '.col' : '.cell[data-r]').forEach(el =>
    before.set(m.axis === 'col' ? el.dataset.c : el.parentElement.dataset.c + ':' + el.dataset.r, el.getBoundingClientRect()));
  const order = m.axis === 'col' ? colOrder : rowOrder;
  order.splice(to, 0, order.splice(m.from, 1)[0]);
  render();
  if (m.axis === 'col') sel = { kind: 'column', c: to }; else sel = { kind: 'row', r: to, ind: true };
  renderSelection();
  grid.querySelectorAll(m.axis === 'col' ? '.col' : '.cell[data-r]').forEach(el => {
    const k = m.axis === 'col' ? el.dataset.c : el.parentElement.dataset.c + ':' + el.dataset.r;
    const a = before.get(k), b = el.getBoundingClientRect();
    if (!a) return;
    const dx = (a.left - b.left) / S, dy = (a.top - b.top) / S;
    if (!dx && !dy) return;
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.position = 'relative'; el.style.zIndex = 1;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = 'transform 200ms ease-out';
      el.style.transform = '';
      el.addEventListener('transitionend', () => { el.style.transition = ''; el.style.zIndex = ''; }, { once: true });
    }));
  });
}

// ---- Pointer ----
const inside = p => p.x >= -12 && p.x <= TW + 12 && p.y >= -12 && p.y <= 420;

addEventListener('mousemove', e => {
  const p = local(e);
  if (move) return dragMove(p);
  if (rangeDrag) {
    const t = hitTest(Math.max(p.x, X[1]), Math.min(Math.max(p.y, HEAD_H), BODY_H - 1));
    if (t && t.zone === 'cell') { sel.r1 = t.r; sel.c1 = t.c; }
    sel.free = p; renderSelection();
    return renderHover(null);
  }
  renderHover(inside(p) && !onRangeHandle(p) ? hitTest(p.x, p.y) : null);
});

addEventListener('mousedown', e => {
  if (e.target.closest('.mode')) return;
  stage.classList.remove('glide');
  const p = local(e);
  if (!inside(p)) { sel = { kind: null }; renderSelection(); return; }
  if (onRangeHandle(p)) {
    // Expand from the handle: the anchor is the top-left cell of the current selection.
    sel = { kind: 'cell', r0: Math.min(sel.r0, sel.r1), c0: Math.min(sel.c0, sel.c1), r1: sel.r1, c1: sel.c1 };
    sel.anchor = { r: sel.r0, c: sel.c0 };
    rangeDrag = true; return;
  }
  const t = hitTest(p.x, p.y);
  if (!t) sel = { kind: null };
  else if (t.zone === 'cell') sel = { kind: 'cell', r0: t.r, c0: t.c, r1: t.r, c1: t.c };
  else if (t.zone === 'col1') sel = { kind: 'header', c: t.c };
  else if (t.zone === 'col2' || t.zone === 'col3') sel = { kind: 'column', c: t.c };
  else if (t.zone === 'row1') sel = { kind: 'row', r: t.r, ind: false };
  else if (t.zone === 'row2' || t.zone === 'row3') sel = { kind: 'row', r: t.r, ind: true };
  renderSelection(); renderHover(t);
  if (dnd && t && t.zone === 'col3') startMove('col', t.c, p);
  if (dnd && t && t.zone === 'row3') startMove('row', t.r, p);
});

addEventListener('mouseup', e => {
  // Release: the box settles on the cells it covers.
  if (rangeDrag) { sel.free = null; stage.classList.add('glide'); renderSelection(); }
  rangeDrag = null;
  if (move) { endMove(false); renderHover(hitTest(...Object.values(local(e)))); }
});

addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (move) endMove(true); sel = { kind: null }; renderSelection(); }
});

setMode(dnd);
</script>
</body>
</html>
